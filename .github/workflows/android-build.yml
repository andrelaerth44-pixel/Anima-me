name: Android APK

on:
  push:
    branches: [ "android-animation-editor" ]
  pull_request:
    branches: [ "android-animation-editor" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run JVM unit tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Fix known V5 Canvas API call
        run: sed -i 's/c\.drawRect(r);/c.drawRect(r,ui);/' app/src/main/java/com/animame/editor/AnimationEditorViewV5.kt
      - name: Fix known V5 Kotlin ternary syntax
        run: sed -i 's/colorPaletteMode?"PALETTE":"HSB"/if(colorPaletteMode)"PALETTE" else "HSB"/' app/src/main/java/com/animame/editor/AnimationEditorViewV5.kt
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anima-me-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
